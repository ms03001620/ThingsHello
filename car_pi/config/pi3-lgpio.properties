# Wiring confirmed against original app and 2026-10-30 physical tests.
hardware.mode=real
hardware.confirmed=true
wheel.enabled=true
left.in1=21
left.in2=20
left.pwm=16
left.forwardHigh=false
right.in1=26
right.in2=19
right.pwm=13
right.forwardHigh=false
pwm.frequencyHz=300
pwm.maxErrorHz=0
light.enabled=true
light.red=22
light.green=27
light.blue=24
light.activeHigh=true
buzzer.enabled=true
buzzer.pin=8
buzzer.activeHigh=false
# 启动成功（READY）后蜂鸣时长，毫秒；0 关闭，默认 1000
buzzer.startupMs=1000
# Servo uses kernel hardware PWM0, separately from lgpio wheel PWM.
servo.enabled=true
servo.pin=18
bind=0.0.0.0
tcp.port=8010
actions.path=results/hardware-actions.jsonl
