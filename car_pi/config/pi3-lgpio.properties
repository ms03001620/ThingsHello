# Wiring confirmed against original app and 2026-10-30 physical tests.
backend=lgpio
hardware.confirmed=true
wheel.enabled=true
left.in1=21
left.in2=20
left.pwm=16
left.forwardHigh=false
right.in1=26
right.in2=19
right.pwm=13
right.forwardHigh=false
pwm.frequencyHz=300
pwm.maxErrorHz=0
light.enabled=true
light.red=22
light.green=27
light.blue=24
light.activeHigh=true
buzzer.enabled=true
buzzer.pin=8
buzzer.activeHigh=false
# Servo requires the separately verified sysfs hardware PWM path, not lgpio PWM.
servo.enabled=false
camera=v4l2
camera.device=/dev/v4l/by-id/usb-lihappe8_Corp._USB_2.0_Camera-video-index0
bind=0.0.0.0
tcp.port=8010
udp.port=8000
actions.path=results/hardware-actions.jsonl
