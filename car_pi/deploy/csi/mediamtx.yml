# MediaMTX 1.21.3, Raspberry Pi arm64 build with rpiCamera support.
logLevel: info
rtsp: true
rtspAddress: :8554
rtspTransports: [udp, tcp]
rtpAddress: :8002
rtcpAddress: :8003
moq: false
rtmp: false
hls: false
webrtc: false
srt: false
paths:
  csi:
    source: rpiCamera
    sourceOnDemand: false
    sourceOnDemandStartTimeout: 20s
    sourceOnDemandCloseAfter: 1s
    rpiCameraWidth: 1280
    rpiCameraHeight: 720
    # Use the 4:3 binned sensor mode to avoid the narrower 1080p sensor crop.
    rpiCameraMode: "1296:972:10:P"
    rpiCameraFPS: 20
    rpiCameraCodec: hardwareH264
    rpiCameraBitrate: 2000000
    rpiCameraIDRPeriod: 10
    rpiCameraH264Profile: baseline
    rpiCameraHFlip: true
    rpiCameraVFlip: true
