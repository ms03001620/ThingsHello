plugins { id 'application' }
repositories { mavenCentral() }
version = providers.gradleProperty('releaseVersion').getOrElse('0.1.0-dev')
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
application { mainClass = 'org.mark.carpi.CarMain' }
dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
jar { manifest { attributes 'Implementation-Version': project.version } }
distributions { main { contents { from('config') { into 'config' }; from('scripts') { into 'scripts' }; from('acceptance') { into 'acceptance' }; from('NOTICE.md'); from('README.md') } } }
