plugins {
    id 'application'
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
}
repositories { mavenCentral() }
// 默认版本号 = 当前 git 短提交号（工作区有未提交改动时加 -dirty）；可用 -PreleaseVersion=xxx 手动覆盖
def gitVersion = {
    try {
        def sha = ['git', 'rev-parse', '--short=7', 'HEAD'].execute(null, projectDir).text.trim()
        if (!sha) return '0.1.0-dev'
        def dirty = ['git', 'status', '--porcelain', '--', '.'].execute(null, projectDir).text.trim()
        return dirty ? "${sha}-dirty" : sha
    } catch (Exception ignored) { return '0.1.0-dev' }
}
version = providers.gradleProperty('releaseVersion').getOrElse(gitVersion())
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21 } }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
application { mainClass = 'org.mark.carpi.CarMain' }
dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
jar { manifest { attributes 'Implementation-Version': project.version } }
distributions { main { contents { from('deploy') { into 'deploy' }; from('config') { into 'config' }; from('scripts') { into 'scripts'; filePermissions { unix('rwxr-xr-x') } }; from('hardware-tests') { into 'hardware-tests'; filePermissions { unix('rwxr-xr-x') } }; from('NOTICE.md'); from('README.md') } } }
